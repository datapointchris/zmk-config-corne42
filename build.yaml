---
include:
  # Corne Choc
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME='"CorneChoc"' -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: corne_choc_left
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME='"CorneChoc"' -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: corne_choc_right

  # Corne MX
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME='"CorneMX"' -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: corne_mx_left
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME='"CorneMX"' -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: corne_mx_right

  # Settings reset (shared, flash to either keyboard)
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
