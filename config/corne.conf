# Deep sleep after 2 hours of idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# TX power boost and keyboard name are set per-build in build.yaml via cmake-args.
# Builds: CorneChoc and CorneMX, both with CONFIG_BT_CTLR_TX_PWR_PLUS_8.

# Disable PHY 2M mode for better host compatibility (especially Windows 11)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Fix Windows battery GATT notification bug causing disconnects
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# WARNING: Do NOT enable CONFIG_ZMK_BLE_EXPERIMENTAL_SEC
# It switches pairing from "Just Works" to passkey-based, which causes
# pairing to hang indefinitely on Linux (BlueZ) and fail on some hosts.

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Enable display support for nice!view
CONFIG_ZMK_DISPLAY=y

# Pointing device support (split-specific configs will enable smooth scrolling)
CONFIG_ZMK_POINTING=y
