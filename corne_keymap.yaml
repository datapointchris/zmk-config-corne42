layout: {zmk_keyboard: corne}
layers:
  BASE:
  - [TAB, Q, W, E, R, T, Y, U, I, O, P, \]
  - [ESC, {t: A, h: GUI}, {t: S, h: Alt}, {t: D, h: Shift}, {t: F, h: Ctrl}, {t: G, h: NAV}, H, {t: J, h: Ctrl}, {t: K, h: Shift}, {t: L, h: Alt}, {t: ;, h: GUI}, '''']
  - [SYSTEM, Z, X, C, V, B, N, M, ',', ., /, SYSTEM]
  - [{h: WM}, {t: BSPC, h: TMUX}, {t: DEL, h: NPAD}, {t: RET, h: ARROW}, {t: SPACE, h: DEVLEFT}, CAPS]
  COLEMAK:
  - [▽, Q, W, F, P, B, J, L, U, Y, ;, ▽]
  - [▽, {t: A, h: GUI}, {t: R, h: Alt}, {t: S, h: Shift}, {t: T, h: Ctrl}, {t: G, h: NAV}, M, {t: N, h: Ctrl}, {t: E, h: Shift}, {t: I, h: Alt}, {t: O, h: GUI}, ▽]
  - [▽, Z, X, C, D, V, K, H, ',', ., /, ▽]
  - [▽, ▽, ▽, ▽, ▽, ▽]
  SYSTEM:
  - [BT CLR, BT 0, BT 1, BT 2, BT 3, '', '', '', VOL UP, '', '', BT CLR ALL]
  - ['&bootloader', '', '', '', '', 'CTRL ALT DEL', '', PREV, PP, NEXT, '', '&bootloader']
  - [{type: held}, '', '', '', '', '', '', '', VOL DN, '', '', '&sys_reset']
  - ['', OUT USB, OUT BLE, OS TOG, '', '']
  NAV:
  - [F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12]
  - [▽, GUI, Alt, Shift, Ctrl, {type: held}, LEFT, DOWN, UP, RIGHT, '', '']
  - [▽, ▽, ▽, ▽, ▽, ▽, '', '', '', '', '', '']
  - ['', ▽, ▽, ▽, '', '']
  NPAD:
  - ['', '', '', PgUp, '', '', +, 7, 8, 9, '-', '|']
  - [▽, GUI, {t: HOME, h: Alt}, {t: PgDn, h: Shift}, {t: END, h: Ctrl}, INSERT, $, {t: 4, h: Ctrl}, {t: 5, h: Shift}, {t: 6, h: Alt}, {t: ':', h: GUI}, '-']
  - [▽, '', '', '', '', '', ',', 1, 2, 3, ., ENTER]
  - [▽, ▽, {type: held}, ▽, 0, 0]
  DEVLEFT:
  - ['`', '!', '@', '%', '&', '?', '', '', '', '', '', '']
  - ['#', ^, '=', _, $, '*', '', ▽, ▽, ▽, ▽, '']
  - ['~', <, '|', '-', '>', '', '', '', '', '', '', '']
  - ['', ▽, ▽, ▽, {type: held}, ▽]
  ARROW:
  - ['', '', '', ↑, '', '', '', '', '', '', '', '']
  - ['', '', ←, ↓, →, '', '', Ctrl, Shift, Alt, GUI, '']
  - ['', '', '', '', '', '', '', '', '', '', '', '']
  - ['', '', '', {type: held}, '', '']
  TMUX:
  - ['', '', '', RENAME, '', '', COPY, SES ⇤, SES ←, SES →, SES ⇥, 'SPLIT |']
  - ['', '', '', '', {t: RESIZE, type: holdmod}, '', PANE ←, PANE ↓, PANE ↑, PANE →, LAST PANE, 'SPLIT -']
  - ['', '', '', '', '', '', NEW WIN, WIN ⇤, WIN ←, WIN →, WIN ⇥, '']
  - ['', {type: held}, '', ZOOM, PICKER, FINDER]
  WM:
  - ['', '', '', ws E, RESIZE, '', MOVE ←, MOVE ↓, MOVE ↑, MOVE →, '', LAYOUT]
  - ['', ws A, ws S, ws D, FLOAT, '', FOCUS ←, FOCUS ↓, FOCUS ↑, FOCUS →, '', ORIENT]
  - ['', ws Z, ws X, '', ws M, '', JOIN ←, JOIN ↓, JOIN ↑, JOIN →, SHIFT, UNGRP]
  - [{type: held}, '', '', FULL, 'Cmd+`', TAB ↔]
  OS_MAC:
  - [▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽]
  - [▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽]
  - [▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽, ▽]
  - [▽, ▽, ▽, ▽, ▽, ▽]
  WM_MAC:
  - [▽, ▽, ▽, ws E, RESIZE, ▽, MOVE ←, MOVE ↓, MOVE ↑, MOVE →, ▽, LAYOUT]
  - [▽, ws A, ws S, ws D, FLOAT, ▽, FOCUS ←, FOCUS ↓, FOCUS ↑, FOCUS →, ▽, ORIENT]
  - [▽, ws Z, ws X, ▽, ws M, ▽, JOIN ←, JOIN ↓, JOIN ↑, JOIN →, ▽, UNGRP]
  - [▽, ▽, ▽, FULL, ▽, TAB ↔]
combos:
  - {p: [1, 2], k: '~', l: [BASE, COLEMAK]}
  - {p: [15, 16], k: '(', l: [BASE, COLEMAK]}
  - {p: [14, 15], k: '[', l: [BASE, COLEMAK]}
  - {p: [14, 16], k: '{', l: [BASE, COLEMAK], a: top, o: -0.05}
  - {p: [13, 14], k: '_', l: [BASE, COLEMAK]}
  - {p: [19, 20], k: ')', l: [BASE, COLEMAK]}
  - {p: [20, 21], k: ']', l: [BASE, COLEMAK]}
  - {p: [19, 21], k: '}', l: [BASE, COLEMAK], a: top, o: -0.05}
  - {p: [21, 22], k: '-', l: [BASE, COLEMAK]}
  - {p: [38, 39], k: COLEMAK, l: [BASE, COLEMAK]}
