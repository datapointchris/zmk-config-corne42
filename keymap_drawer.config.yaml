parse_config:
  # Custom behaviors and their display forms
  # keymap-drawer will automatically parse custom behaviors if they are properly defined
  # in your .dtsi files, but we can provide hints about special ones

  # Sticky label for one-shot/sticky keys
  sticky_label: "⏱"

  # Transparent key styling - use just "▽" in YAML
  trans_legend:
    t: "▽"
    type: trans

  # Simple mappings for tap-dance behaviors
  raw_binding_map:
    # Shorthand aliases for common keys
    "▽": {t: "▽", type: trans}  # Transparent key shorthand
    "&bt_0": "BT 0"
    "&bt_1": "BT 1"
    "&bt_2": "BT 2"
    "&bt_3": "BT 3"

  # Define layer names if display-name doesn't work
  layer_names:
    - BASE
    - DEVLEFT
    - NPAD
    - SYSTEM
    - NAV

draw_config:
  # Layers side by side rather than one tall strip. Stacked, the whole
  # keymap is three times taller than it is wide and takes 198 terminal
  # rows to scroll through; in two columns it takes 50.
  n_columns: 2
  # Optional: Customize appearance
  key_w: 100
  key_h: 100
  split_gap: 30
  combo_w: 40
  combo_h: 36

  # Font sizes
  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 20
  outer_pad_h: 20

  # Legend sizes
  glyph_tap_size: 15
  glyph_hold_size: 14
  glyph_shifted_size: 14
  shrink_wide_legends: 0

  # keymap-drawer's own dark palette, rather than overriding rect.key by hand.
  # Darkening the key alone leaves black legends — svg.keymap sets
  # `fill: #24292e` and every legend inherits it — and leaves the white
  # `paint-order: stroke` halo on text.label. dark_mode moves all three
  # together, and gives combos their own blue so they still separate.
  dark_mode: true

  svg_extra_style: |
    /* A modifier held within a layer rather than to reach one. Same red as
       held, but its own class so it is not the layer-activation marker — the
       drift check treats a held cell as matching whatever the keymap has. */
    rect.holdmod, rect.combo.holdmod { fill: #854747;}
    /* SVG has no background, so this reaches a browser and nothing else. In a
       terminal the drawing composites onto whatever is behind it, which is
       already dark — that is why the keys were the only thing to fix. */
    svg.keymap { background-color: #24272e;}
    path.combo { stroke-width: 3;}
